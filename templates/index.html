<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Phishing URL Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --main-color: #ffffff;
      --bg-color: #000000;
    }

    html {
      box-sizing: border-box;
      font-size: 62.5%;
    }
    *, *::before, *::after {
      box-sizing: inherit;
      margin: 0;
      padding: 0;
    }
    body {
      padding: 5%;
      height: 100vh;
      background-color: var(--bg-color);
      font-family: 'Share Tech Mono', monospace;
      color: var(--main-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.5s ease;
    }
    h2 {
      font-size: 3rem;
      text-align: center;
      margin-bottom: 2rem;
      text-shadow: 0 0 10px var(--main-color);
    }
    form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .form__input {
      font-size: 1.6rem;
      padding: 1.2rem;
      width: 80%;
      max-width: 500px;
      background-color: var(--bg-color);
      border: 1px solid var(--main-color);
      color: var(--main-color);
      border-radius: 0.3rem;
      margin-top: 1rem;
      box-shadow: 0 0 10px var(--main-color);
    }
    .form__input:focus {
      background-color: #111;
      box-shadow: 0 0 15px var(--main-color);
    }
    .button {
      font-size: 1.6rem;
      color: var(--main-color);
      background-color: var(--bg-color);
      border: 2px solid var(--main-color);
      padding: 1rem 2rem;
      margin-top: 2rem;
      border-radius: 0.5rem;
      cursor: pointer;
      text-shadow: 0 0 5px var(--main-color);
      box-shadow: 0 0 15px var(--main-color);
    }
    .button:hover {
      background-color: #111;
      box-shadow: 0 0 20px var(--main-color);
      transform: scale(1.05);
    }
    .main-body {
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      width: 100%;
      max-width: 1200px;
      margin-top: 2rem;
      gap: 2rem;
    }
    .left, .right {
      flex: 1;
    }
    .monitor {
      background-color: var(--bg-color);
      border: 3px solid var(--main-color);
      border-radius: 10px;
      box-shadow: 0 0 20px var(--main-color);
      width: 100%;
      max-height: 300px;
      overflow-y: hidden;
      padding: 1rem;
      font-size: 1.4rem;
    }
    .monitor__screen {
      height: 100%;
      overflow-y: auto;
      white-space: pre-line;
      line-height: 1.5rem;
    }
    .result-message {
      color: var(--main-color);
      margin-top: 1rem;
      font-size: 1.6rem;
      text-align: center;
      display: none;
    }
    #loadingMessage {
      display: none;
      color: var(--main-color);
      margin-top: 1.5rem;
      font-size: 1.6rem;
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: var(--main-color);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-right: 10px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (max-width: 768px) {
      .main-body {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>

<body>

  <h2>PHISHING URL DETECTOR</h2>

  <div class="main-body">
    <!-- LEFT: URL Form -->
    <div class="left">
      <form action="/" method="post">
        <input type="text" name="url" id="url" class="form__input" placeholder="Enter URL to check..." required>
        <button type="submit" class="button">Check URL</button>
      </form>
      <div id="loadingMessage">
        <span class="spinner"></span>
        <span>[PROCESSING] Scanning URL, please wait...</span>
      </div>
    </div>

    <!-- RIGHT: Matrix Terminal Monitor -->
    <div class="right">
        <p class="result-message" id="resultMessage">{{ pred_message }}</p>
        <br>
        <br>
      <div class="monitor">
        <div class="monitor__screen" id="monitorScreen"></div>
      </div>
    </div>
  </div>

  <!-- JavaScript to handle result and theme -->
  <script>
    const xx = {{ xx|default(-1) }};
    const predictionLabel = xx >= 0.5 ? "safe" : xx >= 0 ? "unsafe" : null;

    const monitorScreen = document.getElementById("monitorScreen");
    const resultMessage = document.getElementById("resultMessage");
    const form = document.querySelector("form");
    const loadingMessage = document.getElementById("loadingMessage");

    // Show loading message when submitting
    form.addEventListener("submit", () => {
      loadingMessage.style.display = "block";
      resultMessage.style.display = "none";
      monitorScreen.innerHTML = "";
    });

    const safeLines = [
      "[INFO] Initializing scan engine...",
      "[SCAN] Targeting input URL...",
      "[OK] SSL Certificate found",
      "[INFO] Analyzing domain reputation...",
      "[SAFE] Whitelisted domain found",
      "[INFO] AI Phishing Score: 0.05",
      "[INFO] Domain Age: 7 years",
      "[OK] No suspicious scripts found",
      "[INFO] Finished checking 31 features...",
      "[INFO] Status: SAFE",
      "[...] Awaiting next command..."
    ];

    const unsafeLines = [
      "[INFO] Initializing scan engine...",
      "[SCAN] Targeting input URL...",
      "[OK] SSL Certificate found",
      "[INFO] Analyzing domain reputation...",
      "[UNSAFE] Suspicious domain found",
      "[WARNING] Potential redirect chain detected",
      "[INFO] AI Phishing Score: 0.92",
      "[INFO] Domain Age: 2 months",
      "[WARNING] Suspicious scripts found",
      "[INFO] Finished checking 31 features...",
      "[ALERT] Status: UNSAFE",
      "[...] Awaiting next command..."
    ];

    const codeLines = predictionLabel === "safe" ? safeLines : predictionLabel === "unsafe" ? unsafeLines : [];
    let index = 0;

    if (predictionLabel) {
      loadingMessage.style.display = "none"; // Hide loader after page loads with results
      monitorScreen.innerHTML = "";
      const interval = setInterval(() => {
        if (index < codeLines.length) {
          const line = document.createElement("div");
          line.textContent = codeLines[index];
          monitorScreen.appendChild(line);
          monitorScreen.scrollTop = monitorScreen.scrollHeight;
          index++;
        } else {
          clearInterval(interval);
          resultMessage.style.display = "block";
        }
      }, 600);
    }

    // Theme switching
    if (predictionLabel === "safe") {
      document.documentElement.style.setProperty('--main-color', '#00ff00'); // Green
    } else if (predictionLabel === "unsafe") {
      document.documentElement.style.setProperty('--main-color', '#ff0000'); // Red
    } else {
      document.documentElement.style.setProperty('--main-color', '#ffffff'); // White
    }
  </script>

</body>
</html>
